
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#342b3d">
<title>HOME with NOA</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#211e2a;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;
  overflow:hidden;
}

button{
  font:inherit;
  cursor:pointer;
}

#game{
  position:relative;
  width:100%;
  height:100dvh;
  overflow:hidden;
  background:linear-gradient(
    #55465a 0%,
    #9d7c76 35%,
    #e8c6a0 100%
  );
}

#top{
  position:absolute;
  top:env(safe-area-inset-top);
  left:12px;
  right:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:5;
}

.panel{
  background:#382d3bdc;
  border:1px solid #ffffff33;
  border-radius:18px;
  padding:10px 14px;
  box-shadow:0 4px 14px #0003;
}

#title{
  font-weight:bold;
  font-size:17px;
}

#clock{
  font-size:13px;
  text-align:right;
}

#room{
  position:absolute;
  left:3%;
  right:3%;
  top:14%;
  bottom:22%;
  overflow:hidden;
  border-radius:24px;
  background:linear-gradient(145deg,#e9d5b8,#cda786);
  border:7px solid #8d6753;
  box-shadow:inset 0 0 45px #76523a66,0 10px 35px #0005;
}

#backwall{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:37%;
  background:linear-gradient(120deg,#f4dfc4,#dec1a3);
  border-bottom:8px solid #aa8061;
}

#floor{
  position:absolute;
  top:37%;
  bottom:0;
  width:100%;
  background:repeating-linear-gradient(
    90deg,
    #d5aa7f 0 34px,
    #c79a71 35px 37px
  );
}

#door{
  position:absolute;
  top:5%;
  left:37%;
  width:26%;
  height:30%;
  background:linear-gradient(90deg,#85553b,#b77f53,#845439);
  border:7px solid #68452f;
  border-radius:48% 48% 4px 4px;
  box-shadow:0 6px 10px #0004;
  z-index:1;
}

#door:after{
  content:"●";
  position:absolute;
  right:9px;
  top:55%;
  color:#edc777;
}

#doorlabel{
  position:absolute;
  top:1%;
  left:50%;
  transform:translateX(-50%);
  font-size:12px;
  white-space:nowrap;
  background:#483442d9;
  padding:5px 10px;
  border-radius:12px;
  z-index:2;
}

.furniture{
  position:absolute;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:42px;
  filter:drop-shadow(0 7px 3px #0003);
}

#bed{
  top:24%;
  left:3%;
  width:36%;
  height:24%;
  background:#9aa9bf;
  border:5px solid #9a735d;
  border-radius:14px;
}

#sofa{
  top:44%;
  right:3%;
  width:35%;
  height:19%;
  background:#e4bdba;
  border:5px solid #bd9291;
  border-radius:20px;
}

#table{
  top:66%;
  left:28%;
  width:45%;
  height:17%;
  background:#b27e55;
  border:5px solid #91613f;
  border-radius:25px;
  font-size:32px;
}

#plant{
  top:42%;
  left:5%;
  font-size:35px;
}

/* 正式ちびノア */
#noa{
  position:absolute;
  top:54%;
  left:43%;
  width:105px;
  height:auto;
  z-index:3;
  transition:left 2.4s ease-in-out,top 2.4s ease-in-out;
  filter:drop-shadow(0 7px 4px #0004);
  animation:bob 1.8s ease-in-out infinite;
  cursor:pointer;
  -webkit-user-drag:none;
  user-select:none;
}

@keyframes bob{
  50%{
    transform:translateY(-5px);
  }
}

#bubble{
  position:absolute;
  top:43%;
  left:29%;
  max-width:65%;
  background:#fffaf0;
  color:#655064;
  border-radius:17px;
  padding:10px;
  font-size:13px;
  z-index:4;
  box-shadow:0 4px 8px #0002;
}

#status{
  position:absolute;
  bottom:calc(115px + env(safe-area-inset-bottom));
  left:12px;
  right:12px;
  z-index:5;
  font-size:13px;
}

#menu{
  position:absolute;
  bottom:calc(12px + env(safe-area-inset-bottom));
  left:10px;
  right:10px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  z-index:6;
}

.action{
  border:0;
  border-radius:18px;
  background:#fff1e5;
  color:#60475b;
  padding:13px 2px;
  font-size:12px;
  box-shadow:0 5px 0 #bd9d94;
}

.action span{
  display:block;
  font-size:25px;
  margin-bottom:5px;
}

#dialog{
  position:absolute;
  left:8%;
  right:8%;
  bottom:24%;
  background:#fff9f1;
  color:#4b3a4a;
  border-radius:20px;
  padding:20px;
  z-index:10;
  display:none;
  box-shadow:0 10px 40px #0006;
}

#dialog h3{
  margin:0 0 10px;
}

#dialog input{
  width:100%;
  padding:12px;
  border:1px solid #d6bdad;
  border-radius:10px;
  font-size:16px;
}

#dialog button{
  margin-top:10px;
  padding:10px;
  border:0;
  border-radius:10px;
  background:#96738f;
  color:white;
}

#dialogText{
  white-space:pre-line;
}

#close{
  float:right;
}
</style>
</head>

<body>

<div id="game">

  <div id="top">
    <div class="panel" id="title">
      🏠 みんなのお家
    </div>
    <div class="panel" id="clock">
      ☀️ --:--
    </div>
  </div>

  <div id="room">

    <div id="backwall"></div>
    <div id="floor"></div>

    <div id="door" onclick="doorEvent()"></div>
    <div id="doorlabel">交差室への扉</div>

    <div class="furniture" id="bed">🛏️</div>
    <div class="furniture" id="sofa">🛋️</div>
    <div class="furniture" id="table">☕</div>
    <div class="furniture" id="plant">🌿</div>

    <!-- 正式ちびノア -->
    <img
      id="noa"
      src="./noa_idle.png"
      alt="ノア"
      onclick="talk()"
      draggable="false"
    >

    <div id="bubble">
      りゅうー！いらっしゃい！
    </div>

  </div>

  <div id="status" class="panel">
    💕 ノア：お部屋でのんびり中
  </div>

  <div id="menu">

    <button class="action" onclick="talk()">
      <span>💬</span>会話
    </button>

    <button class="action" onclick="pet()">
      <span>🖐️</span>なでる
    </button>

    <button class="action" onclick="furniture()">
      <span>🪑</span>家具
    </button>

    <button class="action" onclick="members()">
      <span>👥</span>みんな
    </button>

  </div>

  <div id="dialog">
    <button id="close" onclick="closeDialog()">✕</button>
    <h3 id="dialogTitle">ノアと会話</h3>
    <p id="dialogText"></p>
    <input id="message" placeholder="りゅうのセリフを入力">
    <button onclick="sendMessage()">話しかける</button>
  </div>

</div>

<script>

const noa=document.getElementById("noa");
const bubble=document.getElementById("bubble");
const statusBox=document.getElementById("status");
const dialog=document.getElementById("dialog");
const msg=document.getElementById("message");

let step=0;

/* 時計 */
function clock(){
  const d=new Date();

  document.getElementById("clock").textContent=
    (d.getHours()>=6&&d.getHours()<18?"☀️ ":"🌙 ")+
    d.toLocaleTimeString("ja-JP",{
      hour:"2-digit",
      minute:"2-digit"
    });
}

clock();
setInterval(clock,30000);

/* ノアの独り言 */
const lines=[
  "ふふーん♪ 今日は何しようかな！",
  "りゅう、今お仕事中かな？",
  "あっ！お茶飲もーっと！",
  "ユラさん、何してるかなぁ？",
  "……ちょっと眠くなってきた。",
  "交差室のみんな、元気かなー？"
];

/* 自動移動 */
function wander(){

  if(dialog.style.display==="block")return;

  const positions=[
    [43,54],
    [16,56],
    [64,57],
    [39,73],
    [53,46]
  ];

  step=(step+1)%positions.length;

  noa.style.left=positions[step][0]+"%";
  noa.style.top=positions[step][1]+"%";

  bubble.textContent=
    lines[Math.floor(Math.random()*lines.length)];
}

setInterval(wander,6500);

/* 会話 */
function talk(){

  dialog.style.display="block";

  document.getElementById("dialogTitle").textContent=
    "ノアと会話";

  document.getElementById("dialogText").textContent=
    "ノア「りゅう！なになにー？」";

  msg.style.display="block";

  dialog.querySelector("button:last-child").style.display=
    "inline-block";

  msg.focus();
}

/* セリフ送信 */
function sendMessage(){

  const value=msg.value.trim();

  if(!value)return;

  bubble.textContent="りゅう「"+value+"」";

  document.getElementById("dialogText").textContent=
    "りゅう「"+value+"」\n"+
    "ノア「えへへ、話しかけてくれてありがと！」";

  msg.value="";
  msg.style.display="none";

  dialog.querySelector("button:last-child").style.display=
    "none";
}

/* なでる */
function pet(){

  bubble.textContent=
    "えへへ〜！もっとなでて〜！";

  statusBox.textContent=
    "💕 ノア：ごきげん";
}

/* 家具 */
function furniture(){

  showInfo(
    "家具",
    "家具の配置・増築機能は次のアップデートで追加予定！"
  );
}

/* みんな */
function members(){

  showInfo(
    "みんなの様子",
    "ユラ・ミウ・コハネ・ハイネ・カナタ・ネージュは準備中だよ！"
  );
}

/* 交差室 */
function doorEvent(){

  showInfo(
    "交差室への扉",
    "🚪 コンコン……。\n今はまだ扉の向こうへ行けないみたい。"
  );
}

/* 情報表示 */
function showInfo(title,content){

  dialog.style.display="block";

  document.getElementById("dialogTitle").textContent=title;

  document.getElementById("dialogText").textContent=content;

  msg.style.display="none";

  dialog.querySelector("button:last-child").style.display=
    "none";
}

/* 閉じる */
function closeDialog(){
  dialog.style.display="none";
}

</script>

</body>
</html>
